<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Great Hermes — Kid's Keyboard Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-state="prompting">
  <!-- Centralized polite live region for assistive technology -->
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <!-- LAYER 0: Black & White Comic Prompting Backdrop -->
  <div class="bg-bw" aria-hidden="true">
    <div class="halftone-vignette"></div>
  </div>

  <!-- LAYER 1: Vibrant Radial Colour Burst Backdrop (Revealed on Success!) -->
  <div class="bg-color-burst" aria-hidden="true">
    <div class="sunburst-rays"></div>
    <div id="confetti-layer" class="confetti-layer"></div>
  </div>

  <!-- TOP MINIMALIST HUD -->
  <header class="top-hud">
    <div class="hud-left">
      <button
        type="button"
        id="sound-toggle-btn"
        class="icon-btn"
        aria-label="Game sound"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-sound-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-svg icon-sound-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="music-toggle-btn"
        class="icon-btn"
        aria-label="Thinking music"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-music-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <circle cx="17.5" cy="16" r="2.8" fill="currentColor"/>
        </svg>
        <svg class="icon-svg icon-music-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <path d="M15.5 15.5l6 6M21.5 15.5l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="options-btn"
        class="icon-btn"
        popovertarget="parent-options"
        aria-label="Parent options"
      >
        <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="prompt-banner">
      <h1 id="prompt-heading" class="prompt-heading">
        <span id="prompt-prefix">Type:</span>
        <span id="prompt-target" class="prompt-target-char">D</span>
      </h1>
      <p id="buzz-feedback" class="buzz-feedback" hidden>
        Oops! Try again!
      </p>
    </div>

    <div class="hud-right">
      <button
        type="button"
        id="fullscreen-btn"
        class="icon-btn fullscreen-btn"
        aria-label="Enter full screen"
      >
        <svg class="icon-svg icon-fs-enter" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-svg icon-fs-exit" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Native light-dismiss Parent Settings Popover -->
  <div id="parent-options" class="options-popover" popover="auto">
    <h2 class="options-title">Parent Options</h2>
    <div class="options-group">
      <label class="options-label" for="mode-select">Practice Mode</label>
      <select id="mode-select" class="options-select">
        <option value="letters" selected>Letters (A – Z)</option>
        <option value="numbers">Numbers (0 – 9 Aussie 12 Days)</option>
        <option value="both">Letters &amp; Numbers</option>
        <option value="words3">3-Letter Words (50 Words)</option>
        <option value="words4">4-Letter Words (30 Words)</option>
        <option value="words">All Words (3 &amp; 4 Letters)</option>
      </select>
    </div>
    <div class="options-group">
      <label class="options-label" for="order-select">Prompt Order</label>
      <select id="order-select" class="options-select">
        <option value="shuffle" selected>Fun Shuffle</option>
        <option value="sequential">In Order</option>
      </select>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="fast-mode-checkbox">Fast Mode</label>
      <input type="checkbox" id="fast-mode-checkbox" class="options-check">
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="music-checkbox">Happy Thinking Music</label>
      <input type="checkbox" id="music-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="voice-checkbox">Read Words Aloud</label>
      <input type="checkbox" id="voice-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="hint-checkbox">Highlight Key Immediately</label>
      <input type="checkbox" id="hint-checkbox" class="options-check" checked>
    </div>
    <button type="button" id="skip-letter-btn" class="skip-btn">
      Next Prompt →
    </button>
  </div>

  <!-- MAIN GAME STAGE -->
  <main id="game-stage" class="game-stage">
    <div id="scene-rig" class="scene-rig">

      <!-- Colour-Burst Rainbow Arcs shooting out behind the Paper (Celebration Only) -->
      <svg class="color-rainbow-arcs" aria-hidden="true" viewBox="0 0 900 560">
        <!-- Top-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M310,250 C255,155 190,95 115,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M320,258 C268,168 205,112 132,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M330,266 C280,182 220,128 148,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M340,274 C292,196 235,145 165,122" stroke="#46d160" stroke-width="14"/>
          <path d="M350,282 C304,210 250,162 182,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Top-Right Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M590,250 C645,155 710,95 785,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M580,258 C632,168 695,112 768,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M570,266 C620,182 680,128 752,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M560,274 C608,196 665,145 735,122" stroke="#46d160" stroke-width="14"/>
          <path d="M550,282 C596,210 650,162 718,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Mid-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M300,360 C235,285 168,245 92,232" stroke="#ff4d79" stroke-width="12"/>
          <path d="M308,370 C246,300 182,262 108,250" stroke="#ffd83b" stroke-width="12"/>
          <path d="M316,380 C258,315 196,278 124,268" stroke="#3ac8ff" stroke-width="12"/>
        </g>
        <!-- Mid-Right Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M600,360 C665,285 732,245 808,232" stroke="#ff4d79" stroke-width="12"/>
          <path d="M592,370 C654,300 718,262 792,250" stroke="#ffd83b" stroke-width="12"/>
          <path d="M584,380 C642,315 704,278 776,268" stroke="#3ac8ff" stroke-width="12"/>
        </g>
        <!-- Comic Stars at Rainbow Tips -->
        <polygon points="115,38 126,62 152,65 132,82 138,108 115,94 92,108 98,82 78,65 104,62" fill="#ffa826" stroke="#181818" stroke-width="4.5" stroke-linejoin="round"/>
        <polygon points="785,38 796,62 822,65 802,82 808,108 785,94 762,108 768,82 748,65 774,62" fill="#ffe03b" stroke="#181818" stroke-width="4.5" stroke-linejoin="round"/>
        <polygon points="92,205 101,225 122,228 106,242 110,262 92,251 74,262 78,242 62,228 83,225" fill="#ffe03b" stroke="#181818" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="808,205 817,225 838,228 822,242 826,262 808,251 790,262 794,242 778,228 799,225" fill="#ffa826" stroke="#181818" stroke-width="4" stroke-linejoin="round"/>
      </svg>

      <!-- COMIC CALLOUT STICKERS (Shown on Celebration!) -->
      <div class="callout-badge callout-ding" aria-hidden="true">DING!</div>
      <div class="callout-badge callout-yay" aria-hidden="true">YAY!</div>
      <div id="callout-left" class="callout-burst callout-left" aria-hidden="true">
        <span>WOOF!</span>
      </div>
      <div id="callout-right" class="callout-burst callout-right" aria-hidden="true">
        <span>BARK!</span>
      </div>
      <div id="buzz-burst" class="callout-buzz" aria-hidden="true">BZZT!</div>

      <!-- BACK CARRIAGE LAYER: Return Lever, Ribbed Platen Knobs, Paper Guides & Platen behind Paper -->
      <svg class="hermes-carriage-back" aria-hidden="true" viewBox="0 0 1280 612">
        <g class="carriage-assembly" stroke="#181818" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round">
          <!-- Left & Right Angled Paper-Support Ears peeking behind Paper -->
          <path d="M336,28 L350,2 L374,2 L374,30 Z" class="tw-paper-table"/>
          <path d="M906,2 L930,2 L944,28 L906,30 Z" class="tw-paper-table"/>

          <!-- Sleek Teardrop Chrome Carriage Return Lever on Left -->
          <path d="M254,28 L212,8 L206,18 L244,36 Z" class="tw-metal"/>
          <path d="M214,8 C196,-4 164,-6 156,6 C150,16 172,26 208,22 Z" fill="#f7f7f4"/>

          <!-- Right Paper-Release Lever -->
          <path d="M982,28 L998,-2 L1008,2 L994,30 Z" class="tw-metal"/>

          <!-- Left & Right Ribbed Cylindrical Platen Knobs -->
          <rect x="214" y="12" width="44" height="46" rx="8" class="tw-knob"/>
          <path d="M219,21 H253 M219,29 H253 M219,37 H253 M219,45 H253" fill="none" stroke-width="2.8"/>
          <rect x="1022" y="12" width="44" height="46" rx="8" class="tw-knob"/>
          <path d="M1027,21 H1061 M1027,29 H1061 M1027,37 H1061 M1027,45 H1061" fill="none" stroke-width="2.8"/>

          <!-- Chrome Axle Collars & Carriage End-Caps -->
          <rect x="258" y="24" width="22" height="22" rx="3" class="tw-metal"/>
          <rect x="278" y="16" width="28" height="40" rx="6" class="tw-body-side"/>
          <rect x="1000" y="24" width="22" height="22" rx="3" class="tw-metal"/>
          <rect x="974" y="16" width="28" height="40" rx="6" class="tw-body-side"/>

          <!-- Wide Dark Rubber Platen Roller -->
          <rect x="302" y="16" width="676" height="44" rx="14" class="tw-platen"/>
          <path d="M320,25 H960" fill="none" stroke="#6d6e69" stroke-width="3"/>
        </g>
      </svg>

      <!-- UPPER STAGE: PAPER EMERGING FROM PLATEN + LEAPING CRITTER -->
      <div class="paper-stage">
        <div id="paper-sheet" class="paper-sheet">
          <!-- Shared rainbow gradient (always rendered so both single & word SVGs resolve it) -->
          <svg class="shared-svg-defs" width="0" height="0" aria-hidden="true">
            <defs>
              <linearGradient id="rainbow-letter-grad" x1="0%" y1="0%" x2="95%" y2="100%">
                <stop offset="0%" stop-color="#ff3352"/>
                <stop offset="20%" stop-color="#ff9924"/>
                <stop offset="40%" stop-color="#ffe438"/>
                <stop offset="60%" stop-color="#44d662"/>
                <stop offset="80%" stop-color="#2ec8ff"/>
                <stop offset="100%" stop-color="#a259ff"/>
              </linearGradient>
            </defs>
          </svg>

          <!-- Folded top-right dog-ear corner -->
          <span class="paper-dogear" aria-hidden="true"></span>

          <!-- Crisp SVG Outlined / Rainbow Single Letter or Number -->
          <svg id="paper-single-svg" class="paper-letter-svg" aria-hidden="true" viewBox="0 0 240 190">
            <!-- Subtle extruded comic shadow in celebration mode -->
            <text
              id="paper-letter-shadow"
              class="paper-letter-shadow"
              x="124"
              y="150"
              font-size="158"
              text-anchor="middle"
            >D</text>
            <!-- Main Target Letter -->
            <text
              id="paper-letter-text"
              class="paper-letter-text"
              x="118"
              y="144"
              font-size="158"
              text-anchor="middle"
            >D</text>
          </svg>

          <!-- Multi-Letter Word Slots (3-Letter Words + 4-Letter Bonus JUMP) -->
          <div id="paper-word-slots" class="paper-word-slots" hidden aria-hidden="true"></div>

          <!-- Countable Number Tokens reflecting 0-9 on the Answer Sheet -->
          <div id="paper-count-badges" class="paper-count-badges" hidden aria-hidden="true"></div>

          <p id="paper-phrase" class="paper-phrase">D is for Dog!</p>
        </div>

        <!-- Dynamic Cartoon Character Bounding Onto the Paper! -->
        <div id="critter-stage" class="critter-stage"></div>
      </div>

      <!-- LOWER STAGE: HERMES 3000 VINTAGE CARTOON TYPEWRITER (WHISKERED MUZZLE + EYE-TRACKING + LARGE KEYS) -->
      <div class="hermes-typewriter">
        <svg id="hermes-svg" class="hermes-svg" aria-hidden="true" viewBox="0 0 1280 612">
          <defs>
            <!-- Vintage 1930s Comic Ben-Day Halftone Shading Pattern -->
            <pattern id="tw-halftone-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
              <circle cx="3" cy="3" r="1.55" fill="#181818"/>
            </pattern>
            <!-- Sclera Clip Paths so Eye-Tracking Pupils Glide Cleanly Inside Eye Outlines -->
            <clipPath id="eye-clip-left">
              <ellipse cx="462" cy="56" rx="26.8" ry="42.8"/>
            </clipPath>
            <clipPath id="eye-clip-right">
              <ellipse cx="818" cy="56" rx="26.8" ry="42.8"/>
            </clipPath>
          </defs>

          <!-- CHEERING RUBBER-HOSE ARMS (Visible on Success!) -->
          <g class="arms-celebrating">
            <!-- Left Arm Raised High -->
            <path d="M138,264 C64,220 46,122 52,56" fill="none" stroke="#181818" stroke-width="24" stroke-linecap="round"/>
            <path d="M132,258 C72,216 54,126 58,62" fill="none" stroke="#5a5a58" stroke-width="3.8" stroke-linecap="round"/>
            <!-- Left Open Cheering White Cartoon Glove -->
            <g transform="translate(50, 40) rotate(-20)" stroke="#181818" stroke-width="4.5" stroke-linejoin="round">
              <ellipse cx="0" cy="26" rx="22" ry="12" fill="#ffffff"/>
              <path d="M-20,20 L-38,-6 C-44,-18 -26,-26 -18,-12 L-10,4 L-14,-24 C-16,-38 4,-38 4,-22 L6,2 L16,-22 C22,-36 40,-28 32,-12 L20,8 L36,-4 C48,-12 56,6 42,16 L18,26 Z" fill="#ffffff"/>
              <path d="M-8,10 L-10,20 M4,10 L4,20 M14,12 L12,21" fill="none" stroke-width="3.2" stroke-linecap="round"/>
            </g>

            <!-- Right Arm Raised High -->
            <path d="M1142,264 C1216,220 1234,122 1228,56" fill="none" stroke="#181818" stroke-width="24" stroke-linecap="round"/>
            <path d="M1148,258 C1208,216 1226,126 1222,62" fill="none" stroke="#5a5a58" stroke-width="3.8" stroke-linecap="round"/>
            <!-- Right Open Cheering White Cartoon Glove -->
            <g transform="translate(1230, 40) rotate(20) scale(-1, 1)" stroke="#181818" stroke-width="4.5" stroke-linejoin="round">
              <ellipse cx="0" cy="26" rx="22" ry="12" fill="#ffffff"/>
              <path d="M-20,20 L-38,-6 C-44,-18 -26,-26 -18,-12 L-10,4 L-14,-24 C-16,-38 4,-38 4,-22 L6,2 L16,-22 C22,-36 40,-28 32,-12 L20,8 L36,-4 C48,-12 56,6 42,16 L18,26 Z" fill="#ffffff"/>
              <path d="M-8,10 L-10,20 M4,10 L4,20 M14,12 L12,21" fill="none" stroke-width="3.2" stroke-linecap="round"/>
            </g>
          </g>

          <!-- FRONT PAPER BAIL & PLATEN CLAMP BAR (Sits across bottom edge of Paper behind Eyes) -->
          <g class="paper-bail" stroke="#181818" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
            <rect x="314" y="34" width="652" height="18" rx="6" class="tw-platen"/>
            <rect x="328" y="30" width="624" height="8" rx="4" class="tw-metal"/>
            <path d="M342,46 H938" fill="none" stroke="#646560" stroke-width="2.4"/>
          </g>

          <!-- SCULPTED HERMES 3000 VINTAGE CAST-METAL BODY CHASSIS -->
          <g stroke="#181818" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
            <!-- Stepped Rubber Base Molding -->
            <rect x="92" y="588" width="1096" height="18" rx="8" class="tw-base-pad"/>

            <!-- Broad Angled Outer Side Fenders & Lower Chassis Skirt -->
            <path
              d="M196,94 C208,54 252,46 312,46 L968,46 C1028,46 1072,54 1084,94 L1204,552 C1212,580 1192,596 1152,596 L128,596 C88,596 68,580 76,552 Z"
              class="tw-body-side"
            />

            <!-- Comic Ben-Day Halftone Shading on Angled Side Fenders -->
            <path
              d="M196,108 L222,108 L120,584 L86,578 C76,570 76,558 80,546 Z"
              class="tw-halftone"
              stroke="none"
            />
            <path
              d="M1084,108 L1058,108 L1160,584 L1194,578 C1204,570 1204,558 1200,546 Z"
              class="tw-halftone"
              stroke="none"
            />

            <!-- Sculpted Inner Top Deck & Clean Recessed Lower Apron -->
            <path
              d="M220,96 C230,58 268,50 322,50 L958,50 C1012,50 1050,58 1060,96 L1172,544 C1178,568 1160,582 1124,582 L156,582 C120,582 102,568 108,544 Z"
              class="tw-body-main"
            />

            <!-- Recessed Lower-Left & Lower-Right Metal Deck Triangles (Matches Reference Bevels) -->
            <path
              d="M158,398 L124,556 Q122,566 134,566 H372 M1122,398 L1156,556 Q1158,566 1146,566 H908"
              fill="none"
              stroke="#efefea"
              stroke-width="3.6"
              opacity="0.72"
            />
            <path
              d="M154,574 H1126"
              fill="none"
              stroke="#ffffff"
              stroke-width="3.2"
              opacity="0.58"
            />

            <!-- Sculpted Rounded Upper Hood with Removable Ribbon-Cover Seams -->
            <path
              d="M222,102 C232,60 272,50 328,50 L952,50 C1008,50 1048,60 1058,102 L1068,156 L212,156 Z"
              class="tw-body-hood"
            />
            <!-- Curved Hermes Hood Panel Seam Lines Framing the Face -->
            <path d="M380,50 C358,84 354,122 362,156 M900,50 C922,84 926,122 918,156" fill="none" stroke-width="4.4"/>
            <!-- Thick Glossy White Curved Shoulder Highlights on Left & Right Hood -->
            <path
              d="M246,132 C252,76 286,66 346,66 M1034,132 C1028,76 994,66 934,66"
              fill="none"
              stroke="#ffffff"
              stroke-width="7.5"
              opacity="0.74"
            />

            <!-- Iconic Hermes 3000 Ribbon-Cover Faceplate ("=HERMES=" Trim Strip) -->
            <rect x="206" y="160" width="868" height="54" rx="16" class="tw-front-panel"/>
            <path d="M226,168 H1054" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.62"/>

            <!-- Left & Right Pill Hood Latches (Matches Reference Keyhole/Latch Icons) -->
            <circle cx="265" cy="173" r="4" class="tw-metal" stroke-width="3.4"/>
            <rect x="256" y="175" width="18" height="28" rx="9" class="tw-metal" stroke-width="3.8"/>
            <path d="M256,189 H274" fill="none" stroke-width="3.6"/>

            <circle cx="1015" cy="173" r="4" class="tw-metal" stroke-width="3.4"/>
            <rect x="1006" y="175" width="18" height="28" rx="9" class="tw-metal" stroke-width="3.8"/>
            <path d="M1006,189 H1024" fill="none" stroke-width="3.6"/>

            <!-- Vintage Ribbon Color Selector Dots (Left of Right Latch) -->
            <circle cx="972" cy="179" r="4.5" class="tw-ribbon-dot-a" stroke-width="2.8"/>
            <circle cx="972" cy="196" r="4.5" class="tw-ribbon-dot-b" stroke-width="2.8"/>

            <!-- CONTOURED DARK STEPPED KEYWELL BEZEL RIM (Follows 10 -> 10 -> 9 -> 7 -> Spacebar Pyramid!) -->
            <path
              d="M148,220 H1132 Q1150,220 1152,238 L1158,374 Q1158,388 1142,390 L1118,392 Q1104,394 1104,406 L1104,452 Q1104,464 1090,466 L1026,468 Q1012,470 1012,482 L1012,526 Q1012,538 996,540 L910,542 Q896,544 896,554 L896,565 Q896,575 882,575 H398 Q384,575 384,565 L384,554 Q384,544 370,542 L284,540 Q268,538 268,526 L268,482 Q268,470 254,468 L190,466 Q176,464 176,452 L176,406 Q176,394 162,392 L138,390 Q122,388 122,374 L128,238 Q130,220 148,220 Z"
              class="tw-keywell-rim"
            />

            <!-- Deep Dark Recessed Mechanical Keybed Interior -->
            <path

  <!-- Startup Player Name Modal -->
  <dialog id="name-prompt-dialog" class="name-prompt-dialog" closedby="none" aria-labelledby="name-prompt-title">
    <div id="name-entry-step" class="name-prompt-step">
      <h2 id="name-prompt-title" class="name-prompt-title">What is your name?</h2>
      <form id="name-entry-form" class="name-entry-form" novalidate>
        <label class="visually-hidden" for="player-name-input">Your name</label>
        <input
          id="player-name-input"
          class="name-prompt-input"
          type="text"
          maxlength="24"
          autocomplete="given-name"
          placeholder="Type your name..."
          autofocus
          required
        >
        <p id="name-entry-error" class="name-prompt-error" hidden>Please type your name first!</p>
        <div class="name-prompt-actions">
          <button type="submit" id="name-submit-btn" class="name-prompt-btn name-prompt-btn-primary">OK</button>
        </div>
      </form>
    </div>

    <div id="name-confirm-step" class="name-prompt-step" hidden>
      <h2 id="name-confirm-title" class="name-prompt-title"><span id="name-confirm-value"></span>? Is that right?</h2>
      <p class="name-confirm-hint">Press <strong>Y</strong> for Yes or <strong>N</strong> for No</p>
      <div class="name-prompt-actions">
        <button type="button" id="name-yes-btn" class="name-prompt-btn name-prompt-btn-yes">Yes (Y)</button>
        <button type="button" id="name-no-btn" class="name-prompt-btn name-prompt-btn-no">No (N)</button>
      </div>
    </div>
  </dialog>

  <script defer src="js/words.js"></script>

  <script defer src="js/audio.js"></script>
  <script defer src="js/app.js"></script>
</body>
