<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Great Hermes — Kid's Keyboard Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-state="prompting">
  <!-- Centralized polite live region for assistive technology -->
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <!-- LAYER 0: Cozy Scholar's Library Study Backdrop (blooms from B&W ink-wash to full colour!) -->
  <div class="bg-bw" aria-hidden="true">
    <div class="study-room-layer">
      <svg class="study-backdrop-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="study-wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#222742"/>
            <stop offset="55%" stop-color="#191d32"/>
            <stop offset="100%" stop-color="#101322"/>
          </linearGradient>
          <radialGradient id="candle-halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe78c" stop-opacity="0.88"/>
            <stop offset="40%" stop-color="#ffaa3b" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="#ffaa3b" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Deep Twilight Study Wall -->
        <rect width="1600" height="900" fill="url(#study-wall-grad)"/>

        <!-- Recessed Center Library Bookcase Behind Paper -->
        <g opacity="0.72" stroke="#121420" stroke-width="3.5" stroke-linejoin="round">
          <rect x="430" y="25" width="740" height="720" rx="10" fill="#231b2c"/>
          <rect x="455" y="55" width="690" height="665" fill="#181322"/>

          <rect x="448" y="210" width="704" height="22" fill="#462d22"/>

            <rect x="504" y="108" width="26" height="102" rx="4" fill="#2e4548"/>
            <rect x="532" y="88" width="36" height="122" rx="4" fill="#4a4033"/>
            <rect x="570" y="102" width="28" height="108" rx="4" fill="#3a3354"/>
            <rect x="600" y="95" width="34" height="115" rx="4" fill="#4f3538"/>
            <rect x="965" y="98" width="32" height="112" rx="4" fill="#32464b"/>
            <rect x="999" y="88" width="36" height="122" rx="4" fill="#4a3c32"/>
            <rect x="1037" y="106" width="28" height="104" rx="4" fill="#4b3349"/>
            <rect x="1067" y="94" width="34" height="116" rx="4" fill="#354059"/>
            <rect x="1103" y="104" width="30" height="106" rx="4" fill="#4e3d31"/>
            <!-- Middle Back Books -->
            <rect x="468" y="268" width="34" height="117" rx="4" fill="#3c3147"/>
            <rect x="504" y="280" width="28" height="105" rx="4" fill="#4a3a30"/>
            <rect x="534" y="260" width="36" height="125" rx="4" fill="#2d4243"/>
            <rect x="1035" y="272" width="32" height="113" rx="4" fill="#48363a"/>
            <rect x="1069" y="260" width="36" height="125" rx="4" fill="#33434e"/>
            <rect x="1107" y="278" width="28" height="107" rx="4" fill="#4d3d30"/>

        <!-- LEFT TALL OAK BOOKCASE & STACKED TOMES -->

          <path d="M33,286 H67 M33,395 H67" stroke="#e4b75d" stroke-width="3.5"/>

          <rect x="308" y="518" width="40" height="142" rx="5" fill="#7a3444"/>
        </g>

        <!-- RIGHT WOODEN WALL SHELVES, GLOBE, VOLUMES & CANDLES -->
        <g stroke="#14131a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <!-- Upper Right Shelf & Brackets -->
          <path d="M1230,224 L1254,284 M1530,224 L1506,284" stroke="#3c2317" stroke-width="14"/>
          <rect x="1192" y="200" width="418" height="28" rx="6" fill="#684129"/>
          <!-- Upper Right Scrolls & Antique Books -->
          <rect x="1220" y="156" width="104" height="44" rx="14" fill="#e2c792"/>
          <ellipse cx="1228" cy="178" rx="8" ry="22" fill="#c7a568"/>
          <rect x="1272" y="76" width="48" height="124" rx="10" fill="#dfc48f"/>
          <!-- Standing Leather Books -->
          <rect x="1442" y="72" width="40" height="128" rx="5" fill="#365e50"/>
          <path d="M1448,96 H1476 M1448,176 H1476" stroke="#e4b75d" stroke-width="3"/>
          <rect x="1485" y="58" width="44" height="142" rx="5" fill="#823438"/>
          <path d="M1491,86 H1523 M1491,176 H1523" stroke="#e4b75d" stroke-width="3"/>
          <rect x="1532" y="84" width="38" height="116" rx="4" fill="#9a6b30"/>
          <!-- Upper Right Candle -->
          <circle cx="1378" cy="94" r="102" fill="url(#candle-halo)" stroke="none"/>
          <g class="study-candle">
            <path d="M1356,200 V132 C1356,127 1400,127 1400,132 V200 Z" fill="#f6ead0"/>
            <path d="M1378,128 V118" stroke="#181818" stroke-width="3"/>
            <g class="candle-flame">
              <path d="M1378,74 C1390,94 1392,112 1378,120 C1364,112 1366,94 1378,74 Z" fill="#ffae34"/>
              <path d="M1378,90 C1384,100 1385,112 1378,117 C1371,112 1372,100 1378,90 Z" fill="#fff8be"/>
            </g>
          </g>

          <!-- Middle Right Scholarly Shelf: Brass Globe & Leather Encyclopedia Stack -->
          <path d="M1230,456 L1254,516 M1530,456 L1506,516" stroke="#3c2317" stroke-width="14"/>
          <rect x="1192" y="430" width="418" height="28" rx="6" fill="#684129"/>
          <!-- Antique Wooden Stand & Brass Terrestrial Globe -->
          <g transform="translate(1318, 352)">
            <ellipse cx="0" cy="70" rx="34" ry="8" fill="#6c4527"/>
            <rect x="-7" y="48" width="14" height="20" rx="3" fill="#c99944"/>
            <path d="M-28,-38 A54,54 0 1 1 28,44" fill="none" stroke="#d5a64e" stroke-width="6.5"/>
            <circle cx="0" cy="0" r="46" fill="#4f998a"/>

            <path d="M-24,-22 C-10,-28 6,-18 2,-4 C-2,8 -16,20 -26,12 C-34,4 -32,-16 -24,-22 Z" fill="#dfc48d" stroke-width="3"/>
            <path d="M14,-14 C28,-16 38,-2 34,14 C28,26 14,24 12,10 C10,-2 6,-12 14,-14 Z" fill="#d3b47a" stroke-width="3"/>

          </g>

          <!-- Brass Hourglass & Standing Tome -->
          <g transform="translate(1454, 344)">
            <rect x="-30" y="74" width="60" height="12" rx="4" fill="#6c4527"/>
            <rect x="-30" y="-44" width="60" height="12" rx="4" fill="#6c4527"/>
            <line x1="-22" y1="-32" x2="-22" y2="74" stroke="#d5a64e" stroke-width="5"/>
            <line x1="22" y1="-32" x2="22" y2="74" stroke="#d5a64e" stroke-width="5"/>
            <path d="M-16,-32 H16 C16,-4 4,8 0,20 C4,32 16,44 16,74 H-16 C-16,44 -4,32 0,20 C-4,8 -16,-4 -16,-32 Z" fill="#e6f2ef" fill-opacity="0.72"/>

            <path d="M-10,-8 Q0,4 10,-8 Z" fill="#e6be6c" stroke="none"/>
          </g>

          <!-- Lower Right Stacked Books -->
          <rect x="1290" y="610" width="228" height="54" rx="8" fill="#325b4b"/>
          <rect x="1302" y="618" width="204" height="38" rx="4" fill="#ebe0c4"/>
          <rect x="1312" y="560" width="194" height="50" rx="8" fill="#8f3b38"/>
          <rect x="1324" y="568" width="170" height="34" rx="4" fill="#ebe0c4"/>
          <rect x="1332" y="514" width="160" height="46" rx="8" fill="#9b6f32"/>
          <path d="M1350,526 H1474" stroke="#f5d488" stroke-width="3.5"/>
        </g>

        <!-- Warm Candlelight Floating Dust Motes (twinkle & drift when background animates!) -->
        <g class="study-motes" fill="#ffe89c" stroke="none">
          <circle class="mote mote-a" cx="220" cy="210" r="3.5"/>
          <circle class="mote mote-b" cx="385" cy="145" r="2.8"/>
          <circle class="mote mote-c" cx="440" cy="390" r="4"/>
          <circle class="mote mote-a" cx="510" cy="120" r="3"/>
          <circle class="mote mote-b" cx="620" cy="80" r="2.4"/>
          <circle class="mote mote-c" cx="995" cy="95" r="3.2"/>
          <circle class="mote mote-a" cx="1115" cy="220" r="3.8"/>
          <circle class="mote mote-b" cx="1185" cy="370" r="3"/>
          <circle class="mote mote-c" cx="1290" cy="130" r="3.5"/>
          <circle class="mote mote-a" cx="1395" cy="260" r="2.8"/>
          <circle class="mote mote-b" cx="1490" cy="240" r="3.4"/>
          <circle class="mote mote-c" cx="285" cy="495" r="3.2"/>
        </g>
      </svg>
    </div>
    <div class="study-candle-aura"></div>
  </div>

  <!-- LAYER 1: Vibrant Radial Colour Burst Backdrop (Revealed on Success!) -->
  <div class="bg-color-burst" aria-hidden="true">
    <div class="sunburst-rays"></div>
    <div id="confetti-layer" class="confetti-layer"></div>
  </div>

  <!-- TOP MINIMALIST HUD -->
  <header class="top-hud">
    <div class="hud-left">
      <button
        type="button"
        id="sound-toggle-btn"
        class="icon-btn"
        aria-label="Game sound"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-sound-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-svg icon-sound-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="music-toggle-btn"
        class="icon-btn"
        aria-label="Thinking music"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-music-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <circle cx="17.5" cy="16" r="2.8" fill="currentColor"/>
        </svg>
        <svg class="icon-svg icon-music-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <path d="M15.5 15.5l6 6M21.5 15.5l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="options-btn"
        class="icon-btn"
        popovertarget="parent-options"
        aria-label="Parent options"
      >
        <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="prompt-banner">
      <h1 id="prompt-heading" class="prompt-heading">
        <span id="prompt-prefix">Type:</span>
        <span id="prompt-target" class="prompt-target-char">D</span>
      </h1>
      <p id="buzz-feedback" class="buzz-feedback" hidden>
        Oops! Try again!
      </p>
    </div>

    <div class="hud-right">
      <div id="streak-tracker" class="streak-tracker" aria-live="polite">
        <div id="streak-pill" class="streak-pill" title="Correct answers in a row">
          <svg class="streak-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 2.6l2.8 5.7 6.3.9-4.5 4.4 1.1 6.2L12 16.9l-5.7 2.9 1.1-6.2L2.9 9.2l6.3-.9z" fill="currentColor" stroke="#181818" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="streak-label">In a row</span>
          <span id="streak-count" class="streak-value">0</span>
        </div>
        <div id="best-streak-pill" class="best-streak-pill" title="High score to beat" hidden>
          <span class="best-label">Best</span>
          <span id="best-streak-count" class="streak-value">0</span>
        </div>
      </div>

      <button
        type="button"
        id="fullscreen-btn"
        class="icon-btn fullscreen-btn"
        aria-label="Enter full screen"
      >
        <svg class="icon-svg icon-fs-enter" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-svg icon-fs-exit" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Native light-dismiss Parent Settings Popover -->
  <div id="parent-options" class="options-popover" popover="auto">
    <h2 class="options-title">Parent Options</h2>
    <div class="options-group">
      <label class="options-label" for="mode-select">Practice Mode</label>
      <select id="mode-select" class="options-select">
        <option value="letters" selected>Letters (A – Z)</option>
        <option value="numbers">Numbers (0 – 9 Woodland)</option>
        <option value="both">Letters &amp; Numbers</option>
        <option value="words3">3-Letter Words (50 Words)</option>
        <option value="words4">4-Letter Words (30 Words)</option>
        <option value="words">All Words (3 &amp; 4 Letters)</option>
      </select>
    </div>
    <div class="options-group">
      <label class="options-label" for="order-select">Prompt Order</label>
      <select id="order-select" class="options-select">
        <option value="shuffle" selected>Fun Shuffle</option>
        <option value="sequential">In Order</option>
      </select>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="fast-mode-checkbox">Fast Mode</label>
      <input type="checkbox" id="fast-mode-checkbox" class="options-check">
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="music-checkbox">Happy Thinking Music</label>
      <input type="checkbox" id="music-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="voice-checkbox">Read Words Aloud</label>
      <input type="checkbox" id="voice-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="hint-checkbox">Highlight Key Immediately</label>
      <input type="checkbox" id="hint-checkbox" class="options-check" checked>
    </div>
    <button type="button" id="change-name-btn" class="options-action-btn">
      Change Your Name
    </button>
    <button type="button" id="skip-letter-btn" class="skip-btn">
      Next Prompt →
    </button>
  </div>

  <!-- MAIN GAME STAGE -->
  <main id="game-stage" class="game-stage">
    <div id="scene-rig" class="scene-rig">

      <!-- Colour-Burst Rainbow Arcs shooting out behind the Paper (Celebration Only) -->
      <svg class="color-rainbow-arcs" aria-hidden="true" viewBox="0 0 900 560">
        <!-- Top-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M310,250 C255,155 190,95 115,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M320,258 C268,168 205,112 132,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M330,266 C280,182 220,128 148,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M340,274 C292,196 235,145 165,122" stroke="#46d160" stroke-width="14"/>
          <path d="M350,282 C304,210 250,162 182,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Top-Right Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M590,250 C645,155 710,95 785,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M580,258 C632,168 695,112 768,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M570,266 C620,182 680,128 752,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M560,274 C608,196 665,145 735,122" stroke="#46d160" stroke-width="14"/>
          <path d="M550,282 C596,210 650,162 718,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Mid-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M300,360 C235,285 168,245 92,232" stroke="#ff4d79" stroke-width="12"/>
          <path d="M308,370 C246,300 182,262 108,250" stroke="#ffd83b" stroke-width="12"/>
          <path d="M316,380 C258,315 196,278 124,268" stroke="#3ac8ff" stroke-width="12"/>
        </g>
        <!-- Mid-Right Rainbow Arc -->

            <g class="tw-glasses">
              <!-- Temple Arms sweeping back onto Hermes's hood -->
              <path d="M526,104 L346,144" fill="none" stroke="#222220" stroke-width="5.5"/>
              <path d="M754,104 L934,144" fill="none" stroke="#222220" stroke-width="5.5"/>
              <!-- Translucent Spectacle Lenses -->
              <circle cx="578" cy="108" r="50" fill="#ffffff" fill-opacity="0.16" stroke="#222220" stroke-width="6.2"/>
              <circle cx="702" cy="108" r="50" fill="#ffffff" fill-opacity="0.16" stroke="#222220" stroke-width="6.2"/>
              <!-- Inner Metallic Rim Highlight -->
              <circle cx="578" cy="108" r="46" fill="none" stroke="#80827c" stroke-width="1.6" opacity="0.6"/>
              <circle cx="702" cy="108" r="46" fill="none" stroke="#80827c" stroke-width="1.6" opacity="0.6"/>
              <!-- Subtle Diagonal Glass Specular Glare -->
              <path d="M546,84 L564,72 M542,97 L574,77" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.55"/>
              <path d="M670,84 L688,72 M666,97 L698,77" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.55"/>
              <!-- Curved Nose Bridge -->
              <path d="M626,104 Q640,94 654,104" fill="none" stroke="#222220" stroke-width="6"/>
            </g>

            <!-- BUSHY SILVER-WHITE WISE EYEBROWS -->
            <g class="tw-brows" stroke="#181818" stroke-width="4.2">
              <path d="M532,68 C538,44 576,40 598,54 C580,58 552,64 532,68 Z" class="tw-hair-fill"/>
              <path d="M748,68 C742,44 704,40 682,54 C700,58 728,64 748,68 Z" class="tw-hair-fill"/>
            </g>

            <!-- EXPRESSIVE MOUTHS PEEKING UNDER MUSTACHE CENTER -->
            <!-- Mouth State 1: Gentle Warm Wise Smile -->
            <path class="mouth-prompt" d="M624,180 Q640,189 656,180" fill="none" stroke-width="4.4"/>

            <!-- Mouth State 2: Joyful Celebrating Laugh! -->
            <g class="mouth-celebrate" stroke-width="4.4">
              <path d="M610,164 C614,199 666,199 670,164 Z" fill="#701924"/>
              <path d="M622,184 C631,176 649,176 658,184 C649,192 631,192 622,184 Z" fill="#ff758f" stroke="none"/>
            </g>

            <!-- Mouth State 3: Silly Wavy Buzz Mouth -->
            <path class="mouth-buzz" d="M614,181 Q627,173 640,181 T666,181" fill="none" stroke-width="4.6"/>

            <!-- MAGNIFICENT CURLED HANDLEBAR MUSTACHE -->
            <g class="tw-mustache" stroke="#181818" stroke-width="4.6">
              <!-- Left & Right Handlebar Plumes with Curled Tips -->
              <path
                d="M640,148 C622,126 572,130 544,156 C514,182 470,174 456,144 C448,128 468,118 476,132 C482,144 470,152 464,145 C478,162 508,158 524,142 C502,148 468,156 452,148 C464,186 520,196 566,180 C600,168 624,168 640,164 C656,168 680,168 714,180 C760,196 816,186 828,148 C812,156 778,148 756,142 C772,158 802,162 816,145 C810,152 798,144 804,132 C812,118 832,128 824,144 C810,174 766,182 736,156 C708,130 658,126 640,148 Z"
                class="tw-hair-fill"
              />
              <!-- Crisp Mustache Hair Texture Accents -->
              <path d="M604,150 Q574,158 548,172 M676,150 Q706,158 732,172 M640,148 V163" fill="none" stroke="#8b908b" stroke-width="2.6"/>
            </g>
          </g>

          <!-- PROMPTING / POISED SIDE-FENDER ARM SOCKETS -->
          <g class="arms-prompting-sockets">
            <ellipse cx="114" cy="354" rx="13" ry="21" transform="rotate(14 114 354)" class="tw-knob" stroke="#181818" stroke-width="4.6"/>
            <ellipse cx="1166" cy="354" rx="13" ry="21" transform="rotate(-14 1166 354)" class="tw-knob" stroke="#181818" stroke-width="4.6"/>
          </g>
        </svg>

        <!-- INTERACTIVE VINTAGE ROUND NUMBER + QWERTY KEYBOARD OVERLAY ON HERMES' DECK -->
        <div id="typewriter-keys" class="typewriter-keys" role="group" aria-label="On-screen typewriter keys">
          <div id="key-rows-mount" class="key-rows-mount"></div>
          <!-- Timed 10-Second Bouncing Red Arrow Pointer -->
          <div id="key-red-arrow" class="key-red-arrow" hidden aria-hidden="true">
            <svg class="red-arrow-svg" viewBox="0 0 64 78">
              <path
                d="M21,4 H43 V36 H59 L32,72 L5,36 H21 Z"
                fill="#ff1e38"
                stroke="#181818"
                stroke-width="5"
                stroke-linejoin="round"
              />
              <path d="M26,11 V33" stroke="#ff9aa6" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- FOREGROUND RUBBER-HOSE ARMS & GLOVES (Sits Over Keys so Hermes Types & Points on Himself!) -->
        <svg id="hermes-arms-svg" class="hermes-arms-svg" aria-hidden="true" viewBox="0 0 1280 612">
          <g class="arms-prompting">
            <!-- Left Curved Glossy Rubber-Hose Arm -->
            <path id="arm-left-hose" d="M108,354 C28,342 20,474 152,504" fill="none" stroke="#181818" stroke-width="23" stroke-linecap="round"/>
            <path id="arm-left-highlight" d="M104,349 C36,340 30,466 148,498" fill="none" stroke="#666664" stroke-width="3.6" stroke-linecap="round"/>
            <!-- Left Poised 3-Fingered White Cartoon Glove on Lower-Left Deck -->
            <g id="glove-left" class="glove-left" transform="translate(158, 498)" stroke="#181818" stroke-width="4.2" stroke-linejoin="round">
              <ellipse cx="-6" cy="4" rx="8" ry="13" transform="rotate(-18 -6 4)" fill="#ffffff"/>
              <path d="M0,-6 C18,-10 38,-2 44,10 C38,18 26,14 18,8 C24,18 16,26 6,16 C8,24 -4,26 -8,14 Z" fill="#ffffff"/>
            </g>

            <!-- Right Curved Glossy Rubber-Hose Arm -->
            <path id="arm-right-hose" d="M1172,354 C1252,342 1260,474 1128,504" fill="none" stroke="#181818" stroke-width="23" stroke-linecap="round"/>
            <path id="arm-right-highlight" d="M1176,349 C1244,340 1250,466 1132,498" fill="none" stroke="#666664" stroke-width="3.6" stroke-linecap="round"/>
            <!-- Right Poised 3-Fingered White Cartoon Glove on Lower-Right Deck -->
            <g id="glove-right" class="glove-right" transform="translate(1122, 498) scale(-1, 1)" stroke="#181818" stroke-width="4.2" stroke-linejoin="round">
              <ellipse cx="-6" cy="4" rx="8" ry="13" transform="rotate(-18 -6 4)" fill="#ffffff"/>
              <path d="M0,-6 C18,-10 38,-2 44,10 C38,18 26,14 18,8 C24,18 16,26 6,16 C8,24 -4,26 -8,14 Z" fill="#ffffff"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <!-- Startup Player Name Modal -->
  <dialog id="name-prompt-dialog" class="name-prompt-dialog" closedby="none" aria-labelledby="name-prompt-title">
    <div id="name-entry-step" class="name-prompt-step">
      <h2 id="name-prompt-title" class="name-prompt-title">What is your name?</h2>
      <form id="name-entry-form" class="name-entry-form" novalidate>
        <label class="visually-hidden" for="player-name-input">Your name</label>
        <input
          id="player-name-input"
          class="name-prompt-input"
          type="text"
          maxlength="24"
          autocomplete="given-name"
          placeholder="Type your name..."
          autofocus
          required
        >
        <p id="name-entry-error" class="name-prompt-error" hidden>Please type your name first!</p>
        <div class="name-prompt-actions">
          <button type="submit" id="name-submit-btn" class="name-prompt-btn name-prompt-btn-primary">OK</button>
        </div>
      </form>
    </div>

    <div id="name-confirm-step" class="name-prompt-step" hidden>
      <h2 id="name-confirm-title" class="name-prompt-title"><span id="name-confirm-value"></span>? Is that right?</h2>
      <p class="name-confirm-hint">Press <strong>Y</strong> for Yes or <strong>N</strong> for No</p>
      <div class="name-prompt-actions">
        <button type="button" id="name-yes-btn" class="name-prompt-btn name-prompt-btn-yes">Yes (Y)</button>
        <button type="button" id="name-no-btn" class="name-prompt-btn name-prompt-btn-no">No (N)</button>
      </div>
    </div>
  </dialog>

  <script defer src="js/words.js"></script>
  <script defer src="js/illustrations.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
