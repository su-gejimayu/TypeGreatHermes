<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Great Hermes — Kid's Keyboard Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-state="prompting">
  <!-- Centralized polite live region for assistive technology -->
  <div id="sr-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <!-- LAYER 0: Black & White Comic Prompting Backdrop -->
  <div class="bg-bw" aria-hidden="true">
    <div class="halftone-vignette"></div>
  </div>

  <!-- LAYER 1: Vibrant Radial Colour Burst Backdrop (Revealed on Success!) -->
  <div class="bg-color-burst" aria-hidden="true">
    <div class="sunburst-rays"></div>
    <div id="confetti-layer" class="confetti-layer"></div>
  </div>

  <!-- TOP MINIMALIST HUD -->
  <header class="top-hud">
    <div class="hud-left">
      <button
        type="button"
        id="sound-toggle-btn"
        class="icon-btn"
        aria-label="Game sound"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-sound-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-svg icon-sound-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="music-toggle-btn"
        class="icon-btn"
        aria-label="Thinking music"
        aria-pressed="true"
      >
        <svg class="icon-svg icon-music-on" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <circle cx="17.5" cy="16" r="2.8" fill="currentColor"/>
        </svg>
        <svg class="icon-svg icon-music-off" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 18V6l11-2v9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.8" fill="currentColor"/>
          <path d="M15.5 15.5l6 6M21.5 15.5l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        type="button"
        id="options-btn"
        class="icon-btn"
        popovertarget="parent-options"
        aria-label="Parent options"
      >
        <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M12 2.8v2.4M12 18.8v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="prompt-banner">
      <h1 id="prompt-heading" class="prompt-heading">
        <span id="prompt-prefix">Type:</span>
        <span id="prompt-target" class="prompt-target-char">D</span>
      </h1>
      <p id="buzz-feedback" class="buzz-feedback" hidden>
        Oops! Try again!
      </p>
    </div>

    <div class="hud-right">
      <button
        type="button"
        id="fullscreen-btn"
        class="icon-btn fullscreen-btn"
        aria-label="Enter full screen"
      >
        <svg class="icon-svg icon-fs-enter" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-svg icon-fs-exit" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Native light-dismiss Parent Settings Popover -->
  <div id="parent-options" class="options-popover" popover="auto">
    <h2 class="options-title">Parent Options</h2>
    <div class="options-group">
      <label class="options-label" for="mode-select">Practice Mode</label>
      <select id="mode-select" class="options-select">
        <option value="letters" selected>Letters (A – Z)</option>
        <option value="numbers">Numbers (0 – 9 Aussie 12 Days)</option>
        <option value="both">Letters &amp; Numbers</option>
        <option value="words">3-Letter Words (+ Bonus JUMP)</option>
      </select>
    </div>
    <div class="options-group">
      <label class="options-label" for="order-select">Prompt Order</label>
      <select id="order-select" class="options-select">
        <option value="shuffle" selected>Fun Shuffle</option>
        <option value="sequential">In Order</option>
      </select>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="music-checkbox">Happy Thinking Music</label>
      <input type="checkbox" id="music-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="voice-checkbox">Read Words Aloud</label>
      <input type="checkbox" id="voice-checkbox" class="options-check" checked>
    </div>
    <div class="options-group options-row">
      <label class="options-label" for="hint-checkbox">Highlight Key Immediately</label>
      <input type="checkbox" id="hint-checkbox" class="options-check" checked>
    </div>
    <button type="button" id="skip-letter-btn" class="skip-btn">
      Next Prompt →
    </button>
  </div>

  <!-- MAIN GAME STAGE -->
  <main id="game-stage" class="game-stage">
    <div id="scene-rig" class="scene-rig">

      <!-- B&W Comic Starburst Lines behind the Paper -->
      <svg class="bw-paper-burst" aria-hidden="true" viewBox="0 0 800 500">
        <polygon
          points="400,24 446,118 548,48 518,154 662,114 568,208 732,222 586,274 714,348 564,334 636,432 504,376 472,462 400,388 328,462 296,376 164,432 236,334 86,348 214,274 68,222 232,208 138,114 282,154 252,48 354,118"
          fill="#ffffff"
          stroke="#181818"
          stroke-width="4.5"
          stroke-linejoin="round"
        />
        <!-- Comic 4-point sparkles -->
        <path d="M626,64 Q626,92 652,92 Q626,92 626,120 Q626,92 600,92 Q626,92 626,64 Z" fill="#ffffff" stroke="#181818" stroke-width="3.8"/>
        <path d="M168,78 Q168,98 188,98 Q168,98 168,118 Q168,98 148,98 Q168,98 168,78 Z" fill="#ffffff" stroke="#181818" stroke-width="3.8"/>
      </svg>

      <!-- Colour-Burst Rainbow Arcs shooting out behind the Paper -->
      <svg class="color-rainbow-arcs" aria-hidden="true" viewBox="0 0 900 560">
        <!-- Top-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M310,250 C255,155 190,95 115,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M320,258 C268,168 205,112 132,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M330,266 C280,182 220,128 148,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M340,274 C292,196 235,145 165,122" stroke="#46d160" stroke-width="14"/>
          <path d="M350,282 C304,210 250,162 182,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Top-Right Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M590,250 C645,155 710,95 785,68" stroke="#ff3b4e" stroke-width="14"/>
          <path d="M580,258 C632,168 695,112 768,86" stroke="#ff9f24" stroke-width="14"/>
          <path d="M570,266 C620,182 680,128 752,104" stroke="#ffe03b" stroke-width="14"/>
          <path d="M560,274 C608,196 665,145 735,122" stroke="#46d160" stroke-width="14"/>
          <path d="M550,282 C596,210 650,162 718,140" stroke="#3ac8ff" stroke-width="14"/>
        </g>
        <!-- Mid-Left Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M300,360 C235,285 168,245 92,232" stroke="#ff4d79" stroke-width="12"/>
          <path d="M308,370 C246,300 182,262 108,250" stroke="#ffd83b" stroke-width="12"/>
          <path d="M316,380 C258,315 196,278 124,268" stroke="#3ac8ff" stroke-width="12"/>
        </g>
        <!-- Mid-Right Rainbow Arc -->
        <g stroke-linecap="round" fill="none">
          <path d="M600,360 C665,285 732,245 808,232" stroke="#ff4d79" stroke-width="12"/>
          <path d="M592,370 C654,300 718,262 792,250" stroke="#ffd83b" stroke-width="12"/>
          <path d="M584,380 C642,315 704,278 776,268" stroke="#3ac8ff" stroke-width="12"/>
        </g>
        <!-- Comic Stars at Rainbow Tips -->
        <polygon points="115,38 126,62 152,65 132,82 138,108 115,94 92,108 98,82 78,65 104,62" fill="#ffa826" stroke="#181818" stroke-width="4.5" stroke-linejoin="round"/>
        <polygon points="785,38 796,62 822,65 802,82 808,108 785,94 762,108 768,82 748,65 774,62" fill="#ffe03b" stroke="#181818" stroke-width="4.5" stroke-linejoin="round"/>
        <polygon points="92,205 101,225 122,228 106,242 110,262 92,251 74,262 78,242 62,228 83,225" fill="#ffe03b" stroke="#181818" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="808,205 817,225 838,228 822,242 826,262 808,251 790,262 794,242 778,228 799,225" fill="#ffa826" stroke="#181818" stroke-width="4" stroke-linejoin="round"/>
      </svg>

      <!-- COMIC CALLOUT STICKERS (Shown on Celebration!) -->
      <div class="callout-badge callout-ding" aria-hidden="true">DING!</div>
      <div class="callout-badge callout-yay" aria-hidden="true">YAY!</div>
      <div id="callout-left" class="callout-burst callout-left" aria-hidden="true">
        <span>WOOF!</span>
      </div>
      <div id="callout-right" class="callout-burst callout-right" aria-hidden="true">
        <span>BARK!</span>
      </div>
      <div id="buzz-burst" class="callout-buzz" aria-hidden="true">BZZT!</div>

      <!-- BACK CARRIAGE LAYER: Platen Roller, Knobs & Return Lever behind the Paper -->
      <svg class="hermes-carriage-back" aria-hidden="true" viewBox="0 0 1200 540">
        <g class="carriage-assembly" stroke="#181818" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round">
          <path d="M296,36 C258,32 246,4 216,-4 L198,-2 C196,10 216,20 236,22 C248,38 268,50 296,52 Z" class="tw-metal"/>
          <rect x="254" y="20" width="28" height="46" rx="8" class="tw-knob"/>
          <rect x="918" y="20" width="28" height="46" rx="8" class="tw-knob"/>
          <rect x="282" y="28" width="20" height="30" rx="4" class="tw-metal"/>
          <rect x="898" y="28" width="20" height="30" rx="4" class="tw-metal"/>
          <rect x="302" y="18" width="596" height="48" rx="16" class="tw-platen"/>
        </g>
      </svg>

      <!-- UPPER STAGE: PAPER EMERGING FROM PLATEN + LEAPING CRITTER -->
      <div class="paper-stage">
        <div id="paper-sheet" class="paper-sheet">
          <!-- Shared rainbow gradient (always rendered so both single & word SVGs resolve it) -->
          <svg class="shared-svg-defs" width="0" height="0" aria-hidden="true">
            <defs>
              <linearGradient id="rainbow-letter-grad" x1="0%" y1="0%" x2="95%" y2="100%">
                <stop offset="0%" stop-color="#ff3352"/>
                <stop offset="20%" stop-color="#ff9924"/>
                <stop offset="40%" stop-color="#ffe438"/>
                <stop offset="60%" stop-color="#44d662"/>
                <stop offset="80%" stop-color="#2ec8ff"/>
                <stop offset="100%" stop-color="#a259ff"/>
              </linearGradient>
            </defs>
          </svg>

          <!-- Folded top-right dog-ear corner -->
          <span class="paper-dogear" aria-hidden="true"></span>

          <!-- Crisp SVG Outlined / Rainbow Single Letter or Number -->
          <svg id="paper-single-svg" class="paper-letter-svg" aria-hidden="true" viewBox="0 0 240 190">
            <!-- Subtle extruded comic shadow in celebration mode -->
            <text
              id="paper-letter-shadow"
              class="paper-letter-shadow"
              x="124"
              y="150"
              font-size="158"
              text-anchor="middle"
            >D</text>
            <!-- Main Target Letter -->
            <text
              id="paper-letter-text"
              class="paper-letter-text"
              x="118"
              y="144"
              font-size="158"
              text-anchor="middle"
            >D</text>
          </svg>

          <!-- Multi-Letter Word Slots (3-Letter Words + 4-Letter Bonus JUMP) -->
          <div id="paper-word-slots" class="paper-word-slots" hidden aria-hidden="true"></div>

          <!-- Countable Number Tokens reflecting 0-9 on the Answer Sheet -->
          <div id="paper-count-badges" class="paper-count-badges" hidden aria-hidden="true"></div>

          <p id="paper-phrase" class="paper-phrase">D is for Dog!</p>
        </div>

        <!-- Dynamic Cartoon Character Bounding Onto the Paper! -->
        <div id="critter-stage" class="critter-stage"></div>
      </div>

      <!-- LOWER STAGE: HERMES THE 1930s RUBBER-HOSE CARTOON TYPEWRITER (WIDE CHILD-SCALE KEYBOARD DECK) -->
      <div class="hermes-typewriter">
        <svg class="hermes-svg" aria-hidden="true" viewBox="0 0 1200 540">
          <!-- CHEERING RUBBER-HOSE ARMS (Visible on Success!) -->
          <g class="arms-celebrating">
            <!-- Left Arm Raised High -->
            <path d="M168,208 C92,180 68,102 62,48" fill="none" stroke="#181818" stroke-width="26" stroke-linecap="round"/>
            <path d="M162,202 C98,176 76,106 68,54" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
            <!-- Left Open Cheering White Cartoon Glove -->
            <g transform="translate(56, 32) rotate(-22)" stroke="#181818" stroke-width="4.5" stroke-linejoin="round">
              <ellipse cx="0" cy="26" rx="22" ry="12" fill="#ffffff"/>
              <path d="M-20,20 L-38,-6 C-44,-18 -26,-26 -18,-12 L-10,4 L-14,-24 C-16,-38 4,-38 4,-22 L6,2 L16,-22 C22,-36 40,-28 32,-12 L20,8 L36,-4 C48,-12 56,6 42,16 L18,26 Z" fill="#ffffff"/>
              <path d="M-8,10 L-10,20 M4,10 L4,20 M14,12 L12,21" fill="none" stroke-width="3.2" stroke-linecap="round"/>
            </g>

            <!-- Right Arm Raised High -->
            <path d="M1032,208 C1108,180 1132,102 1138,48" fill="none" stroke="#181818" stroke-width="26" stroke-linecap="round"/>
            <path d="M1038,202 C1102,176 1124,106 1132,54" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
            <!-- Right Open Cheering White Cartoon Glove -->
            <g transform="translate(1144, 32) rotate(22) scale(-1, 1)" stroke="#181818" stroke-width="4.5" stroke-linejoin="round">
              <ellipse cx="0" cy="26" rx="22" ry="12" fill="#ffffff"/>
              <path d="M-20,20 L-38,-6 C-44,-18 -26,-26 -18,-12 L-10,4 L-14,-24 C-16,-38 4,-38 4,-22 L6,2 L16,-22 C22,-36 40,-28 32,-12 L20,8 L36,-4 C48,-12 56,6 42,16 L18,26 Z" fill="#ffffff"/>
              <path d="M-8,10 L-10,20 M4,10 L4,20 M14,12 L12,21" fill="none" stroke-width="3.2" stroke-linecap="round"/>
            </g>
          </g>

          <!-- MAIN VINTAGE HERMES WIDE CHASSIS (Built around Large Child-Legible 4-Row Keyboard!) -->
          <g stroke="#181818" stroke-width="5.2" stroke-linejoin="round" stroke-linecap="round">
            <!-- Red/Dark Base Trim Cushion -->
            <rect x="84" y="512" width="1032" height="22" rx="11" class="tw-base-pad"/>
            <!-- Outer Wide Lower Chassis Shell -->
            <path d="M196,88 C206,38 250,26 312,26 L888,26 C950,26 994,38 1004,88 L1132,484 C1140,514 1118,524 1080,524 L120,524 C82,524 60,514 68,484 Z" class="tw-body-main"/>
            <!-- Upper Hood Crown Highlight -->
            <path d="M226,92 C236,48 272,36 326,36 L874,36 C928,36 964,48 974,92 C978,120 956,136 920,136 L280,136 C244,136 222,120 226,92 Z" class="tw-body-hood"/>
            <!-- Typebar Basket Cutout Arc behind Nose -->
            <path d="M498,94 C532,74 668,74 702,94 C682,110 518,110 498,94 Z" class="tw-platen"/>
            <!-- Slim Front Ribbon Trim Bar & HERMES Script Emblem -->
            <rect x="138" y="140" width="924" height="36" rx="12" class="tw-front-panel"/>
            <!-- Left & Right Chrome Latches -->
            <rect x="168" y="146" width="14" height="24" rx="5" class="tw-metal"/>
            <rect x="1018" y="146" width="14" height="24" rx="5" class="tw-metal"/>
            <!-- Wide Recessed Dark 4-Row Keyboard Well (Numbers 1-0 + Letters Q-M + Spacebar) -->
            <path d="M114,182 L1086,182 L1116,502 C1118,510 1108,514 1092,514 L108,514 C92,514 82,510 84,502 Z" class="tw-keywell"/>
          </g>

          <!-- HERMES VINTAGE SCRIPT BADGE -->
          <text x="600" y="166" font-size="24" text-anchor="middle" class="hermes-logo-text">HERMES</text>

          <!-- HERMES' EXPRESSIVE 1930s CARTOON FACE -->
          <g class="hermes-face" stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
            <!-- Rosy Cheeks -->
            <ellipse cx="500" cy="106" rx="22" ry="12" class="tw-cheek" stroke="none"/>
            <ellipse cx="700" cy="106" rx="22" ry="12" class="tw-cheek" stroke="none"/>

            <!-- PROMPTING & CELEBRATING OPEN PIE-CUT EYES -->
            <g class="eyes-open">
              <!-- Eyebrows -->
              <path class="brow-left" d="M524,22 Q550,8 574,20" fill="none" stroke-width="6.2"/>
              <path class="brow-right" d="M626,20 Q650,8 676,22" fill="none" stroke-width="6.2"/>
              <!-- Sclera Ovals -->
              <ellipse cx="558" cy="66" rx="28" ry="37" fill="#ffffff" stroke-width="5"/>
              <ellipse cx="642" cy="66" rx="28" ry="37" fill="#ffffff" stroke-width="5"/>
              <!-- 1930s Pie-Cut Pupils -->
              <g class="pupils-group">
                <ellipse cx="561" cy="59" rx="14" ry="19" fill="#181818" stroke="none"/>
                <polygon points="561,59 579,48 579,63" fill="#ffffff" stroke="none"/>
                <ellipse cx="639" cy="59" rx="14" ry="19" fill="#181818" stroke="none"/>
                <polygon points="639,59 657,48 657,63" fill="#ffffff" stroke="none"/>
              </g>
            </g>

            <!-- BUZZING / OOPS SQUINTING EYES (> <) -->
            <g class="eyes-buzz" fill="none" stroke-width="7.2">
              <path d="M532,50 L576,68 L532,84"/>
              <path d="M668,50 L624,68 L668,84"/>
              <!-- Comic Sweat Drop -->
              <path d="M712,42 C702,60 708,74 718,74 C728,74 734,60 712,42 Z" fill="#ffffff" stroke-width="4.4"/>
            </g>

            <!-- Cute Button Nose -->
            <ellipse cx="600" cy="95" rx="12" ry="8.5" class="tw-nose" stroke-width="4.4"/>

            <!-- Mouth State 1: Gentle Curious Prompting Smile -->
            <g class="mouth-prompt" fill="none" stroke-width="5">
              <path d="M556,110 Q600,132 644,110"/>
              <path d="M550,104 Q554,112 562,114 M650,104 Q646,112 638,114" stroke-width="4"/>
            </g>

            <!-- Mouth State 2: Joyful Celebrating Laugh! -->
            <g class="mouth-celebrate" stroke-width="4.8">
              <path d="M546,104 C554,142 646,142 654,104 Q600,113 546,104 Z" fill="#701924"/>
              <path d="M568,126 C582,114 618,114 632,126 C618,136 582,136 568,126 Z" fill="#ff758f" stroke="none"/>
            </g>

            <!-- Mouth State 3: Silly Wavy Buzz Mouth -->
            <path class="mouth-buzz" d="M562,118 Q576,107 588,118 T614,118 T640,118" fill="none" stroke-width="5.2"/>
          </g>

          <!-- PROMPTING / POISED RUBBER-HOSE ARMS (Flanking Outer Bezel so Keys Have Full Width!) -->
          <g class="arms-prompting">
            <!-- Left Curved Rubber-Hose Arm -->
            <path d="M114,228 C18,242 10,342 74,368" fill="none" stroke="#181818" stroke-width="24" stroke-linecap="round"/>
            <path d="M110,224 C28,238 20,336 72,362" fill="none" stroke="#525252" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Left Poised Cartoon Glove -->
            <g class="glove-left" transform="translate(64, 348)" stroke="#181818" stroke-width="4.4" stroke-linejoin="round">
              <ellipse cx="0" cy="14" rx="13" ry="19" transform="rotate(-18)" fill="#ffffff"/>
              <path d="M8,-2 C26,-6 44,4 50,20 C44,28 32,24 24,16 L32,32 C26,40 14,34 10,22 L10,34 C2,40 -10,32 -8,20 C-20,22 -24,10 -14,2 Z" fill="#ffffff"/>
              <path d="M2,8 L14,12 M-2,16 L10,20" fill="none" stroke-width="3"/>
            </g>

            <!-- Right Curved Rubber-Hose Arm -->
            <path d="M1086,228 C1182,242 1190,342 1126,368" fill="none" stroke="#181818" stroke-width="24" stroke-linecap="round"/>
            <path d="M1090,224 C1172,238 1180,336 1128,362" fill="none" stroke="#525252" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Right Poised Cartoon Glove -->
            <g class="glove-right" transform="translate(1136, 348) scale(-1, 1)" stroke="#181818" stroke-width="4.4" stroke-linejoin="round">
              <ellipse cx="0" cy="14" rx="13" ry="19" transform="rotate(-18)" fill="#ffffff"/>
              <path d="M8,-2 C26,-6 44,4 50,20 C44,28 32,24 24,16 L32,32 C26,40 14,34 10,22 L10,34 C2,40 -10,32 -8,20 C-20,22 -24,10 -14,2 Z" fill="#ffffff"/>
              <path d="M2,8 L14,12 M-2,16 L10,20" fill="none" stroke-width="3"/>
            </g>
          </g>
        </svg>

        <!-- INTERACTIVE VINTAGE ROUND NUMBER + QWERTY KEYBOARD OVERLAY ON HERMES' DECK -->
        <div id="typewriter-keys" class="typewriter-keys" role="group" aria-label="On-screen typewriter keys">
          <div id="key-rows-mount" class="key-rows-mount"></div>
          <!-- Timed 10-Second Bouncing Red Arrow Pointer -->
          <div id="key-red-arrow" class="key-red-arrow" hidden aria-hidden="true">
